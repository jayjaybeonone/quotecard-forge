services:
  renderer:
    build:
      context: ./renderer
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
              fonts-dejavu-core && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY render.py .
        ENTRYPOINT ["python", "render.py"]
    volumes:
      - ./configs:/app/configs:ro
      - ./samples:/app/samples
      - ./data:/app/data
    # Usage:
    #   docker compose run --rm renderer --config /app/configs/barbers.json --output /app/samples --db /app/data/jobs.db
    command: ["--config", "/app/configs/restaurants-bars.json", "--output", "/app/samples", "--db", "/app/data/jobs.db"]
